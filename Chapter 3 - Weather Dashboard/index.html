<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>🌦️ Weather Dashboard ☀️</h1>
      <div class="search-container">
        <input type="text" id="cityInput" placeholder="Enter city name" />
        <button id="searchButton">Search</button>
      </div>
      <!-- <div id="weatherInfo" class="weather-info hidden"></div> -->
      <div id="weatherInfo" class="weather-info hidden">
        <h2 id="cityAndCountry"></h2>
        <p>Temperature: <span id="tempValue"></span> °C</p>
        <p>Weather: <span id="weatherDesc"></span></p>
        <p>Humidity: <span id="humidityValue"></span>%</p>
        <p>Wind Speed: <span id="windValue"></span> m/s</p>
      </div>
      <div id="errorMessage" class="error-message"></div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
